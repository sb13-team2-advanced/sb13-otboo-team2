name: otboo-shared-monitoring

services:
  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      GF_SERVER_DOMAIN: ${GRAFANA_ADDRESS:?Set GRAFANA_ADDRESS to the server public IP or DNS name}
      GF_SERVER_ROOT_URL: https://${GRAFANA_ADDRESS}/
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_PLUGINS_PREINSTALL_SYNC: grafana-amazonprometheus-datasource
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_EXECUTE_ALERTS: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    environment:
      GRAFANA_ADDRESS: ${GRAFANA_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - grafana
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?Set GRAFANA_ADMIN_PASSWORD_FILE to an existing secret file outside this repository}

volumes:
  grafana-data:
  caddy-data:
  caddy-config:
