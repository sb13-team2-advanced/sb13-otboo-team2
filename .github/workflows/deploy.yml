name: CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      JWT_SECRET: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Build, test, and generate coverage reports
        run: ./gradlew clean build --no-daemon

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
            build/reports/checkstyle/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to ECS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: '121246721746'
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY: otboo-backend
      ECS_CLUSTER: otboo-dev-cluster
      ECS_SERVICE: otboo-backend
      ECS_CONTAINER_NAME: otboo-backend

    steps:
      - name: Check deployment configuration
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo '::error::Set the AWS_DEPLOY_ROLE_ARN repository variable before deploying.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push container image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/amd64 --tag "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Download the service's current task definition
        run: |
          task_definition_arn=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ -z "$task_definition_arn" ] || [ "$task_definition_arn" = 'None' ]; then
            echo '::error::The ECS service has no task definition.'
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$task_definition_arn" \
            --query taskDefinition \
            --output json > "$RUNNER_TEMP/task-definition.json"

      - name: Update the container image in the task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy and wait for service stability
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 20
          wait-max-delay-seconds: 15

      - name: Verify the deployed revision
        env:
          EXPECTED_TASK_DEFINITION: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json > "$RUNNER_TEMP/deployed-service.json"

          if ! jq --exit-status --arg expected "$EXPECTED_TASK_DEFINITION" '
            (.failures | length) == 0 and
            (.services | length) == 1 and
            (.services[0] |
              .taskDefinition == $expected and
              .desiredCount > 0 and
              .runningCount == .desiredCount and
              .pendingCount == 0 and
              (.deployments | length) == 1 and
              all(.deployments[];
                .taskDefinition == $expected and .rolloutState == "COMPLETED"))
          ' "$RUNNER_TEMP/deployed-service.json" > /dev/null; then
            echo '::error::The service is not running the expected revision. Check ECS deployment events for rollback or startup failures.'
            exit 1
          fi

          {
            echo '### ECS deployment completed'
            echo "- Commit: $GITHUB_SHA"
            echo "- Service: $ECS_CLUSTER/$ECS_SERVICE"
            echo "- Task definition: $EXPECTED_TASK_DEFINITION"
          } >> "$GITHUB_STEP_SUMMARY"
