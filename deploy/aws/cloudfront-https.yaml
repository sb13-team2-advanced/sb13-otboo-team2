AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS entry point for the existing Otboo development ALB using a CloudFront domain.

Parameters:
  AlbDomainName:
    Type: String
    Default: otboo-dev-alb-815971349.ap-northeast-2.elb.amazonaws.com
    Description: Existing public ALB DNS name without a scheme or path.
    AllowedPattern: '^[a-zA-Z0-9-]+\.[a-z0-9-]+\.elb\.amazonaws\.com$'

Resources:
  HttpsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Otboo development HTTPS entry point
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          - Id: otboo-alb
            DomainName: !Ref AlbDomainName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: otboo-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 400
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
          - ErrorCode: 405
            ErrorCachingMinTTL: 0
          - ErrorCode: 414
            ErrorCachingMinTTL: 0
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 501
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  DistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref HttpsDistribution
  HttpsUrl:
    Description: HTTPS base URL for the application and OOTD_SERVER_URL.
    Value: !Sub 'https://${HttpsDistribution.DomainName}'
  RecommendationsUrl:
    Description: Weather and outfit recommendations page.
    Value: !Sub 'https://${HttpsDistribution.DomainName}/#/recommendations'
