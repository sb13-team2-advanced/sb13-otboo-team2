spring:
  datasource:
    url: jdbc:postgresql://${OOTD_DB_HOST}:${OOTD_DB_PORT:5432}/${OOTD_DB_NAME}
    username: ${OOTD_DB_USERNAME}
    password: ${OOTD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${OOTD_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: ${OOTD_FLYWAY_ENABLED:true}
  docker:
    compose:
      enabled: false

server:
  port: ${OOTD_SERVER_PORT:8080}

logging:
  level:
    root: info
    codeit.ootd: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.batch: warn
    org.hibernate.orm.jdbc.bind: warn

ootd:
  openapi:
    server-url: ${OOTD_SERVER_URL}
    server-description: 운영 배포 서버
