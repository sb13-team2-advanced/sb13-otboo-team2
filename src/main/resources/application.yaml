
spring:
  application:
    name: sb13-otboo-team2
  profiles:
    default: dev,kafka
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/google"
            scope:
              - email
              - profile

          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/kakao"
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    doc-expansion: list
    display-request-duration: true

otboo:
  realtime:
    redis:
      enabled: ${OTBOO_REALTIME_REDIS_ENABLED:true}
      channel-prefix: ${OTBOO_REALTIME_REDIS_CHANNEL_PREFIX:otboo:realtime:v1}
  kafka:
    enabled: false
  notification:
    kafka:
      enabled: false
  storage:
    type: local
    local:
      root-path: ./uploads
      base-url: /files
  admin:
    name: ${ADMIN_NAME:관리자}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30m

ootd:
  embedding:
    cache:
      enabled: true
      maximum-size: 512
      ttl: 24h
      model-revision: v1
      preprocessing-version: query-normalized-v1
  groq:
    enabled: ${OOTD_GROQ_ENABLED:false}
    api-key: ${GROQ_API_KEY:}
    model: ${OOTD_GROQ_MODEL:openai/gpt-oss-20b}
    connect-timeout: 2s
    read-timeout: 8s
  weather:
    openweathermap:
      api-key: ${OWM_API_KEY}
      connect-timeout: ${OWM_CONNECT_TIMEOUT:2s}
      read-timeout: ${OWM_READ_TIMEOUT:5s}
    batch:
      scheduler-enabled: ${OOTD_WEATHER_BATCH_SCHEDULER_ENABLED:false}
      min-request-interval: ${OOTD_BATCH_MIN_REQUEST_INTERVAL:2s}
    cleanup:
      scheduler-enabled: ${OOTD_WEATHER_CLEANUP_SCHEDULER_ENABLED:false}
  kakao:
    local:
      api-key: ${KAKAO_API_KEY}
      connect-timeout: ${KAKAO_CONNECT_TIMEOUT:2s}
      read-timeout: ${KAKAO_READ_TIMEOUT:5s}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db

auth:
  cookie:
    secure: true
