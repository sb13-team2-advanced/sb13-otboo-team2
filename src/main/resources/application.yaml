spring:
  application:
    name: sb13-otboo-team2
  profiles:
    default: dev
  jpa:
    open-in-view: false

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

otboo:
  storage:
    type: local
    local:
      root-path: ./uploads
      base-url: /files

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30m

ootd:
  weather:
    openweathermap:
      api-key: ${OWM_API_KEY}
