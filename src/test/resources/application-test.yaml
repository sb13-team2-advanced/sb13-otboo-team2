spring:
  datasource:
    url: jdbc:h2:mem:ootd-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  mail:
    host: localhost
    port: 2525
    username: test@example.com
    password: test-password

  jpa:
    hibernate:
      ddl-auto: create
  flyway:
    enabled: false
