    compose:
      enabled: false
  batch:
    jdbc:
      initialize-schema: always

ootd:
  weather:
    openweathermap:
      api-key: test-key
  kakao:
    local:
      api-key: test-key

jwt:
  secret: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
  access-token-expiration: 30m